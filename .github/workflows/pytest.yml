name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and test deps
        run: |
          python -m pip install --upgrade pip build
          pip install -c constraints.txt -e .[dev]

      - name: Run tests
        run: pytest -q

      - name: Build wheel
        run: python -m build

      - name: Smoke-install wheel
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          /tmp/smoke/bin/agent-reach version
          cd /tmp && /tmp/smoke/bin/python -c "from agent_reach.osge import OSGE_PROFILE; print(OSGE_PROFILE)"
